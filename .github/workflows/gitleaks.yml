name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 6 * * 1"

permissions:
  contents: read

concurrency:
  group: terminalbeta-gitleaks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        run: |
          set -euo pipefail
          version=v8.30.1
          expected_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/${version}/gitleaks_${version#v}_linux_x64.tar.gz"
          printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin"
      - name: Scan
        run: |
          set -euo pipefail
          cfg=()
          [ ! -f .gitleaks.toml ] || cfg=(--config .gitleaks.toml)
          base=()
          [ ! -f .gitleaks.baseline.json ] || base=(--baseline-path .gitleaks.baseline.json)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            "$RUNNER_TEMP/gitleaks-bin" git --log-opts '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}' --redact "${cfg[@]}" "${base[@]}" --no-banner .
          else
            "$RUNNER_TEMP/gitleaks-bin" git --redact "${cfg[@]}" "${base[@]}" --no-banner .
          fi

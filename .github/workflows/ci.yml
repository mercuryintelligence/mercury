name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminalbeta-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      run_package: ${{ steps.classify.outputs.run_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify impact
        id: classify
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only --diff-filter=ACDMRTUXB "$PR_BASE_SHA...$PR_HEAD_SHA" > changed.txt
          elif [ "$GITHUB_EVENT_NAME" = push ] && [[ "$PUSH_BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
            git diff --no-renames --name-only --diff-filter=ACDMRTUXB "$PUSH_BEFORE_SHA..$PUSH_HEAD_SHA" > changed.txt
          else
            git ls-files > changed.txt
          fi
          run_package=false
          while IFS= read -r path; do
            case "$path" in
              plugins/*|.claude-plugin/*|.agents/plugins/*|skills/*|scripts/*|.github/workflows/*) run_package=true ;;
              *.md|docs/*|.beads/*|.specialists/*|.xtrm/*|.claude/skills/*) ;;
              *) run_package=true ;; # unknown fails safe
            esac
          done < changed.txt
          echo "run_package=$run_package" >> "$GITHUB_OUTPUT"
          cat changed.txt

  package:
    name: Plugin & marketplace contract
    needs: scope
    if: needs.scope.outputs.run_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin manifests
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const read = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const fail = (m) => { throw new Error(m); };
          const root = 'plugins/mercury';
          const claudeMarket = read('.claude-plugin/marketplace.json');
          const codexMarket = read('.agents/plugins/marketplace.json');
          const claudePlugin = read(`${root}/.claude-plugin/plugin.json`);
          const codexPlugin = read(`${root}/plugin.json`);
          const claudeMcp = read(`${root}/.mcp.json`).mcpServers;
          const codexMcp = read(`${root}/mcp.json`).mcpServers;

          // Install ids are <entry>@<marketplace>; entry and manifest names must match.
          for (const [label, name] of [
            ['claude marketplace', claudeMarket.name], ['codex marketplace', codexMarket.name],
            ['claude entry', claudeMarket.plugins?.[0]?.name], ['codex entry', codexMarket.plugins?.[0]?.name],
            ['claude plugin', claudePlugin.name], ['codex plugin', codexPlugin.name],
          ]) if (name !== 'mercury') fail(`${label} name must be "mercury", got ${name}`);
          if (claudeMarket.plugins[0].source !== `./${root}`) fail('claude marketplace source path');
          if (codexMarket.plugins[0].source?.path !== `./${root}`) fail('codex marketplace source path');
          if (claudePlugin.version !== codexPlugin.version) fail('claude and codex plugin versions differ');

          // One OAuth server. No headers means no API key can creep back in.
          for (const [label, servers] of [['claude', claudeMcp], ['codex', codexMcp]]) {
            const names = Object.keys(servers || {});
            if (names.length !== 1 || names[0] !== 'mercury') fail(`${label} must declare exactly one server "mercury"`);
            const s = servers.mercury;
            if (s.headers) fail(`${label} server must use OAuth, not headers`);
            if (new URL(s.url).href !== 'https://mcp.mercuryintelligence.net/mcp') fail(`${label} server url ${s.url}`);
          }
          if (claudeMcp.mercury.type !== 'http' || !claudeMcp.mercury.oauth?.clientId) fail('claude server needs type http and oauth.clientId');
          // The portable Agent Plugins schema is strict: extra keys make Codex drop the server.
          const extra = Object.keys(codexMcp.mercury).filter((k) => !['type', 'url'].includes(k));
          if (extra.length) fail(`codex server has unsupported keys: ${extra}`);

          if (!fs.existsSync(`${root}/skills/using-mercury/SKILL.md`)) fail('using-mercury skill missing from plugin');
          console.log(`validated plugin mercury ${claudePlugin.version}`);
          NODE
      - name: Packaged skill matches source
        run: |
          cp skills/using-mercury.skill /tmp/committed.skill
          bash scripts/build-skill.sh
          cmp skills/using-mercury.skill /tmp/committed.skill

  gate:
    name: ci/gate
    if: always()
    needs: [scope, package]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce selected jobs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          RUN_PACKAGE: ${{ needs.scope.outputs.run_package }}
        run: |
          set -euo pipefail
          [ "$SCOPE_RESULT" = success ]
          if [ "$RUN_PACKAGE" = true ]; then [ "$PACKAGE_RESULT" = success ]; else case "$PACKAGE_RESULT" in skipped|success) ;; *) exit 1 ;; esac; fi
